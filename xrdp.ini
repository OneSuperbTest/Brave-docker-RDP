[Globals]
ini_version=1
fork=true
port=3389
use_vsock=false
tcp_nodelay=true
tcp_keepalive=true
security_layer=negotiate
crypt_level=high
certificate=/etc/xrdp/cert.pem
key_file=/etc/xrdp/key.pem
autorun=
allow_channels=true
allow_multimon=true
bitmap_compression=true
max_bpp=32
xserverbpp=24
h264_frame_interval=16
rfx_frame_interval=32
normal_frame_interval=40
xrdp_mm_process_start_script=/etc/xrdp/startwm.sh
log_level=INFO
enable_token_login=true

[Xorg]
name=Xorg
lib=libxup.so
username=ask
password=ask
ip=127.0.0.1
port=-1
code=20

[Logging]
LogFile=/data/logs/xrdp-internal.log
LogLevel=INFO
EnableSyslog=false
SyslogLevel=INFO
